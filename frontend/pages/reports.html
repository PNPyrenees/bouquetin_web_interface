<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <!-- Script classique (pas de module/defer) volontairement — doit s'executer de facon
       synchrone avant le premier paint pour rediriger sans flash si pas de session. -->
  <script>
    if (!sessionStorage.getItem('bqt_token')) {
      window.location.replace('../login.html');
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plateforme de suivi des bouquetins - Parc National des Pyrénées">
  <meta name="robots" content="noindex, nofollow">
  <title>Statistiques - Suivi des bouquetins</title>
  <link rel="icon" type="image/png" href="../assets/img/PNP_logo_minuature.png">

  <!-- Préchargement des logos du header pour éviter leur flash au changement de page -->
  <link rel="preload" href="../assets/img/logo-parc.svg" as="image" type="image/svg+xml" fetchpriority="high">
  <link rel="preload" href="../assets/img/Logo_-_République_française.svg" as="image" type="image/svg+xml" fetchpriority="high">
  <link rel="preload" href="../assets/img/bqt_header.webp" as="image" type="image/webp" fetchpriority="high">

  <!-- Préchargement des icônes de navigation pour stabiliser le header dans Firefox -->
  <link rel="preload" href="../assets/img/pointeur-de-localisation.png" as="image" type="image/png" fetchpriority="high">
  <link rel="preload" href="../assets/img/animaux-domestiques.png" as="image" type="image/png" fetchpriority="high">
  <link rel="preload" href="../assets/img/rapport.png" as="image" type="image/png" fetchpriority="high">
  <link rel="preload" href="../assets/img/chevron-bas.png" as="image" type="image/png" fetchpriority="high">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Préchargement de Bebas Neue pour stabiliser le titre du header -->
  <link rel="preload"
    href="https://fonts.gstatic.com/s/bebasneu/v16/JTUSjIg69CK48gW7PXoo9WdhyyTh89ZNpQ.woff2"
    as="font"
    type="font/woff2"
    crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Bebas+Neue&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/reports.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/fr.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</head>

<body>
  <header id="header">
    <div class="header-top">
      <div class="header-top-left">
        <img src="../assets/img/logo-parc.svg" alt="Logo Parc National des Pyrénées" class="logo-parc" width="601" height="301" decoding="sync" fetchpriority="high">
        <img src="../assets/img/Logo_-_République_française.svg" alt="République Française" class="logo-rf" width="267" height="217" decoding="sync" fetchpriority="high">
        <img src="../assets/img/bqt_header.webp" alt="Bouquetin" class="logo-bqt" width="220" height="147" decoding="sync" fetchpriority="high">

        <h1 class="header-title">Suivi des bouquetins ibériques</h1>
      </div>
      <nav class="header-nav" id="mainNav">
        <a href="../index.html" class="nav-link">
          <img src="../assets/img/pointeur-de-localisation.png" alt="" class="nav-icon" width="512" height="512" decoding="sync" fetchpriority="high">
          Carte
        </a>
        <a href="individuals.html" class="nav-link">
          <img src="../assets/img/animaux-domestiques.png" alt="" class="nav-icon" width="512" height="512" decoding="sync" fetchpriority="high">
          Individus
        </a>
        <a href="reports.html" class="nav-link active">
          <img src="../assets/img/rapport.png" alt="" class="nav-icon" width="512" height="512" decoding="sync" fetchpriority="high">
          statistiques
        </a>
        <a href="#" id="btnAjouter" class="nav-link nav-link-add" style="display: none;">+ Ajouter</a>
      </nav>
      <div class="header-top-right">
        <div class="session-dropdown" id="userChip" style="display:none">
          <button class="session-trigger" id="sessionTrigger">
            <span class="session-avatar" id="sessionAvatar">--</span>
            <img id="sessionChevron" class="session-chevron" src="../assets/img/chevron-bas.png" alt="" width="512" height="512" decoding="sync" fetchpriority="high">
          </button>
          <div class="session-menu" id="sessionMenu" style="display:none">
            <div class="session-menu-header">Session</div>
            <div class="session-menu-role" id="sessionRole"></div>
            <hr class="session-menu-divider">
            <button class="session-menu-item" id="btnDeconnexion">Se déconnecter</button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <!-- Script classique synchrone : initialise la session avant le premier rendu du header. -->
  <script src="../assets/js/reports.js"></script>

  <aside class="sidebar" id="reportsSidebar">
    <div class="sidebar-content">
      <div class="sidebar-header">FILTRES</div>
      <div class="reports-sidebar-body">
        <div class="date-row">
          <div class="input-group">
            <label for="reportsDateFrom">Du</label>
            <input type="text" class="sidebar-input" id="reportsDateFrom" placeholder="JJ/MM/AAAA" autocomplete="off">
          </div>
          <div class="input-group">
            <label for="reportsDateTo">Au</label>
            <input type="text" class="sidebar-input" id="reportsDateTo" placeholder="JJ/MM/AAAA" autocomplete="off">
          </div>
        </div>
        <div class="input-group">
          <label>Population</label>
          <select id="filtreReportsPopulation" class="reports-col-filtre">
            <option value="">Tous</option>
          </select>
        </div>
        <div class="input-group">
          <label>Gestionnaire</label>
          <select id="filtreReportsGestionnaire" class="reports-col-filtre">
            <option value="">Tous</option>
          </select>
        </div>
        <div class="input-group">
          <label>Sexe</label>
          <select id="filtreReportsSexe" class="reports-col-filtre">
            <option value="">Tous</option>
            <option value="M">M</option>
            <option value="F">F</option>
          </select>
        </div>
      </div>
      <div class="sidebar-footer">
        <a id="btnReinitialiserFiltresReports" class="reports-lien-reinitialiser">Réinitialiser</a>
      </div>
    </div>
  </aside>

  <main id="reportsScreen">
    <div class="reports-content">
      <!-- Grille de chiffres cles — peuplee par reports.js a partir de l'etape 2, jamais de
           valeur codee en dur ici. "—" = etat initial/chargement. -->
      <div class="reports-kpi-grid" id="reportsKpiGrid">
        <div class="reports-kpi-cell">
          <div class="reports-kpi-value" id="kpiTotalIndividus">-</div>
          <div class="reports-kpi-label">Individus recensés</div>
        </div>
        <div class="reports-kpi-cell">
          <div class="reports-kpi-value" id="kpiEquipes">-</div>
          <div class="reports-kpi-label">Équipés d'un collier</div>
          <div class="reports-kpi-sub" id="kpiEquipesSub">Cumul historique</div>
        </div>
        <div class="reports-kpi-cell">
          <div class="reports-kpi-value" id="kpiSuiviGps">-</div>
          <div class="reports-kpi-label">Suivis GPS</div>
          <div class="reports-kpi-sub" id="kpiSuiviGpsPourcentage"></div>
          <div class="reports-kpi-sub" id="kpiSuiviGpsPeriode"></div>
        </div>
        <div class="reports-kpi-cell reports-masque">
          <div class="reports-kpi-value" id="kpiTransloques">-</div>
          <div class="reports-kpi-label">Individus transloqués</div>
          <div class="reports-kpi-sub" id="kpiTransloquesRepartition"></div>
        </div>
        <div class="reports-kpi-cell reports-masque">
          <div class="reports-kpi-value" id="kpiEvenementsTranslocation">-</div>
          <div class="reports-kpi-label">Événements de translocation</div>
        </div>
        <div class="reports-kpi-cell reports-masque">
          <div class="reports-kpi-value" id="kpiZones">-</div>
          <div class="reports-kpi-label">Zones de translocation</div>
        </div>
        <div class="reports-kpi-cell reports-masque">
          <div class="reports-kpi-value" id="kpiCaptures">-</div>
          <div class="reports-kpi-label">Captures</div>
        </div>
        <div class="reports-kpi-cell reports-masque">
          <div class="reports-kpi-value" id="kpiCapturesSanitaires">-</div>
          <div class="reports-kpi-label">Captures sanitaires</div>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
