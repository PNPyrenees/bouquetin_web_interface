<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plateforme de suivi des bouquetins - Parc National des Pyrénées">
  <title>Statistiques - Suivi des bouquetins</title>
  <link rel="icon" type="image/png" href="../assets/img/PNP_logo_minuature.png">

  <!-- Préchargement des logos du header pour éviter leur flash au changement de page -->
  <link rel="preload" href="../assets/img/logo-parc.svg" as="image" type="image/svg+xml" fetchpriority="high">
  <link rel="preload" href="../assets/img/Logo_-_République_française.svg" as="image" type="image/svg+xml" fetchpriority="high">
  <link rel="preload" href="../assets/img/bqt_header.webp" as="image" type="image/webp" fetchpriority="high">

  <!-- Préchargement des icônes de navigation pour stabiliser le header dans Firefox -->
  <link rel="preload" href="../assets/img/pointeur-de-localisation.png" as="image" type="image/png" fetchpriority="high">
  <link rel="preload" href="../assets/img/animaux-domestiques.png" as="image" type="image/png" fetchpriority="high">
  <link rel="preload" href="../assets/img/rapport.png" as="image" type="image/png" fetchpriority="high">
  <link rel="preload" href="../assets/img/chevron-bas.png" as="image" type="image/png" fetchpriority="high">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Préchargement de Bebas Neue pour stabiliser le titre du header -->
  <link rel="preload"
    href="https://fonts.gstatic.com/s/bebasneu/v16/JTUSjIg69CK48gW7PXoo9WdhyyTh89ZNpQ.woff2"
    as="font"
    type="font/woff2"
    crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Bebas+Neue&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body>
  <header id="header">
    <div class="header-top">
      <div class="header-top-left">
        <img src="../assets/img/logo-parc.svg" alt="Logo Parc National des Pyrénées" class="logo-parc" width="601" height="301" decoding="sync" fetchpriority="high">
        <img src="../assets/img/Logo_-_République_française.svg" alt="République Française" class="logo-rf" width="267" height="217" decoding="sync" fetchpriority="high">
        <img src="../assets/img/bqt_header.webp" alt="Bouquetin" class="logo-bqt" width="220" height="147" decoding="sync" fetchpriority="high">

        <h1 class="header-title">Suivi des bouquetins ibériques</h1>
      </div>
      <nav class="header-nav" id="mainNav">
        <a href="../index.html" class="nav-link">
          <img src="../assets/img/pointeur-de-localisation.png" alt="" class="nav-icon" width="512" height="512" decoding="sync" fetchpriority="high">
          Carte
        </a>
        <a href="individuals.html" class="nav-link">
          <img src="../assets/img/animaux-domestiques.png" alt="" class="nav-icon" width="512" height="512" decoding="sync" fetchpriority="high">
          Individus
        </a>
        <a href="reports.html" class="nav-link active">
          <img src="../assets/img/rapport.png" alt="" class="nav-icon" width="512" height="512" decoding="sync" fetchpriority="high">
          statistiques
        </a>
        <a href="#" id="btnAjouter" class="nav-link nav-link-add" style="display: none;">+ Ajouter</a>
      </nav>
      <div class="header-top-right">
        <div class="session-dropdown" id="userChip" style="display:none">
          <button class="session-trigger" id="sessionTrigger">
            <span class="session-avatar" id="sessionAvatar">--</span>
            <img id="sessionChevron" class="session-chevron" src="../assets/img/chevron-bas.png" alt="" width="512" height="512" decoding="sync" fetchpriority="high">
          </button>
          <div class="session-menu" id="sessionMenu" style="display:none">
            <div class="session-menu-header">Session</div>
            <div class="session-menu-role" id="sessionRole"></div>
            <hr class="session-menu-divider">
            <button class="session-menu-item" id="btnDeconnexion">Se déconnecter</button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <script>
    (() => {
      const token = sessionStorage.getItem('bqt_token');
      if (!token) return;

      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        const role = payload.role || payload.sub || 'Utilisateur';
        const initiales = {
          pnp_bqt_reader: 'LC',
          pnp_bqt_writer: 'AD'
        }[role] || role.slice(0, 2).toUpperCase();
        const libelle = {
          pnp_bqt_reader: 'Lecteur',
          pnp_bqt_writer: 'Administrateur'
        }[role] || role;

        document.getElementById('sessionAvatar').textContent = initiales;
        document.getElementById('sessionRole').textContent = libelle;
        document.getElementById('userChip').style.display = 'flex';
      } catch {
        return;
      }

      const menu = document.getElementById('sessionMenu');
      const chevron = document.getElementById('sessionChevron');

      document.getElementById('sessionTrigger').addEventListener('click', (event) => {
        event.stopPropagation();
        const ouverture = menu.style.display === 'none';
        menu.style.display = ouverture ? 'block' : 'none';
        chevron.style.transform = ouverture ? 'rotate(180deg)' : 'rotate(0deg)';
      });

      document.addEventListener('click', () => {
        menu.style.display = 'none';
        chevron.style.transform = 'rotate(0deg)';
      });

      document.getElementById('btnDeconnexion').addEventListener('click', () => {
        sessionStorage.removeItem('bqt_token');
        window.location.replace('../index.html');
      });
    })();
  </script>
  <main style="padding: 40px; font-family: var(--font-family); color: var(--color-text);">
    <h1 style="color: var(--color-primary); margin-bottom: 16px;">Hello</h1>
    <p style="color: var(--color-text-muted);">World</p>
  </main>
</body>

</html>
