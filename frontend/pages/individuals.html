<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <!-- Script classique (pas de module/defer) volontairement — doit s'executer de facon
       synchrone avant le premier paint pour rediriger sans flash si pas de session. -->
  <script>
    if (!sessionStorage.getItem('bqt_token')) {
      window.location.replace('../login.html');
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plateforme de suivi des bouquetins - Parc National des Pyrénées">
  <meta name="robots" content="noindex, nofollow">
  <title>Individus - Suivi des bouquetins</title>
  <link rel="icon" type="image/png" href="../assets/img/PNP_logo_minuature.png">

  <!-- Préchargement des logos du header pour éviter leur flash au changement de page dans Firefox -->
  <link rel="preload" href="../assets/img/logo-parc.svg" as="image" type="image/svg+xml" fetchpriority="high">
  <link rel="preload" href="../assets/img/Logo_-_République_française.svg" as="image" type="image/svg+xml" fetchpriority="high">
  <link rel="preload" href="../assets/img/bqt_header.webp" as="image" type="image/webp" fetchpriority="high">

  <!-- Préchargement des icônes de navigation pour stabiliser le header dans Firefox -->
  <link rel="preload" href="../assets/img/pointeur-de-localisation.png" as="image" type="image/png" fetchpriority="high">
  <link rel="preload" href="../assets/img/animaux-domestiques.png" as="image" type="image/png" fetchpriority="high">
  <link rel="preload" href="../assets/img/chart-pie-solid-full.svg" as="image" type="image/svg+xml" fetchpriority="high">
  <link rel="preload" href="../assets/img/chevron-bas.png" as="image" type="image/png" fetchpriority="high">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Préchargement de Bebas Neue pour éviter le FOUC typographique sur le header-title -->
  <link rel="preload"
    href="https://fonts.gstatic.com/s/bebasneu/v16/JTUSjIg69CK48gW7PXoo9WdhyyTh89ZNpQ.woff2"
    as="font"
    type="font/woff2"
    crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Bebas+Neue&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.9.0/ol.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/individuals.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <script src="https://cdn.jsdelivr.net/npm/ol@v10.9.0/dist/ol.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/fr.js"></script>
</head>

<body>
  <header id="header">
    <div class="header-top">
      <div class="header-top-left">
        <img src="../assets/img/logo-parc.svg" alt="Logo Parc National des Pyrénées" class="logo-parc" width="601" height="301" decoding="sync" fetchpriority="high">
        <img src="../assets/img/Logo_-_République_française.svg" alt="République Française" class="logo-rf" width="267" height="217" decoding="sync" fetchpriority="high">
        <img src="../assets/img/bqt_header.webp" alt="Bouquetin" class="logo-bqt" width="220" height="147" decoding="sync" fetchpriority="high">

        <h1 class="header-title">Suivi des bouquetins ibériques</h1>
      </div>
      <nav class="header-nav" id="mainNav">
        <a href="../index.html" class="nav-link">
          <img src="../assets/img/pointeur-de-localisation.png" alt="" class="nav-icon" width="512" height="512" decoding="sync" fetchpriority="high">
          Carte
        </a>
        <a href="individuals.html" class="nav-link active">
          <img src="../assets/img/animaux-domestiques.png" alt="" class="nav-icon" width="512" height="512" decoding="sync" fetchpriority="high">
          Individus
        </a>
        <a href="reports.html" class="nav-link">
          <img src="../assets/img/chart-pie-solid-full.svg" alt="" class="nav-icon" width="512" height="512" decoding="sync" fetchpriority="high">
          statistiques
        </a>
        <a href="#" id="btnAjouter" class="nav-link nav-link-add">+ Ajouter</a>
      </nav>
      <div class="header-top-right">
        <div class="session-dropdown" id="userChip" style="display:none">
          <button class="session-trigger" id="sessionTrigger">
            <span class="session-avatar" id="sessionAvatar">--</span>
            <img id="sessionChevron" class="session-chevron" src="../assets/img/chevron-bas.png" alt="" width="512" height="512" decoding="sync" fetchpriority="high">
          </button>
          <div class="session-menu" id="sessionMenu" style="display:none">
            <div class="session-menu-header">Session</div>
            <div class="session-menu-role" id="sessionRole"></div>
            <hr class="session-menu-divider">
            <button class="session-menu-item" id="btnDeconnexion">Se déconnecter</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <script src="../assets/js/session-chip.js"></script>

  <aside class="sidebar" id="indivSidebar">
    <div class="sidebar-content">
      <div class="sidebar-header" id="indivSidebarHeader">FILTRES</div>
      <div class="indiv-sidebar-body">
        <div class="input-group indiv-filtre-liste">
          <label for="filtreColNom">Nom</label>
          <input type="text" id="filtreColNom" class="sidebar-input" placeholder="Rechercher..." autocomplete="off">
        </div>
        <div class="input-group indiv-filtre-liste">
          <label>Oreille droite</label>
          <select id="filtreColOreilleDroite" class="indiv-col-filtre">
            <option value="">Tous</option>
          </select>
        </div>
        <div class="input-group indiv-filtre-liste">
          <label>Oreille gauche</label>
          <select id="filtreColOreilleGauche" class="indiv-col-filtre">
            <option value="">Tous</option>
          </select>
        </div>
        <div class="input-group indiv-filtre-liste">
          <label>Couleur du collier</label>
          <select id="filtreColCouleurCollier" class="indiv-col-filtre">
            <option value="">Tous</option>
          </select>
        </div>
        <div class="input-group indiv-filtre-liste">
          <label>Sexe</label>
          <select id="filtreColSexe" class="indiv-col-filtre">
            <option value="">Tous</option>
            <option value="M">M</option>
            <option value="F">F</option>
          </select>
        </div>
        <div class="input-group indiv-filtre-liste">
          <label>Population</label>
          <select id="filtreColPopulation" class="indiv-col-filtre">
            <option value="">Tous</option>
          </select>
        </div>
        <div class="input-group indiv-filtre-liste">
          <label>Gestionnaire</label>
          <select id="filtreColGestionnaire" class="indiv-col-filtre">
            <option value="">Tous</option>
          </select>
        </div>
        <div class="input-group indiv-filtre-liste">
          <label>Statut</label>
          <select id="filtreColStatut" class="indiv-col-filtre">
            <option value="">Tous</option>
            <option value="actif">Suivi actif</option>
            <option value="non_suivi">Non suivi</option>
            <option value="mort">Mort</option>
          </select>
        </div>
        <div class="input-group indiv-filtre-liste">
          <label>Captures/Relâchés</label>
          <select id="filtreColCaptures" class="indiv-col-filtre">
            <option value="">Tous</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3+">3+</option>
          </select>
        </div>
      </div>
      <div class="sidebar-footer">
        <a id="btnReinitialiserFiltres" class="indiv-lien-reinitialiser">Réinitialiser</a>
      </div>

      <div class="indiv-sidebar-identite" id="indivSidebarIdentite">
        <div class="fiche-illustration-bloc">
          <div class="fiche-illustration">
            <img src="../assets/img/bqt_profil_normal.jpg" alt="" class="fiche-illustration-photo" id="fichePhoto">
            <svg class="fiche-illustration-collier fiche-illustration-masque" viewBox="0 0 193.23 103.56" xmlns="http://www.w3.org/2000/svg">
              <use id="useCollier" href="../assets/img/sprite.svg#icon-collier"/>
            </svg>
            <svg class="fiche-illustration-oreille fiche-illustration-oreille-gauche" viewBox="0 0 57.32 80.86" xmlns="http://www.w3.org/2000/svg">
              <use id="useOreilleGauche" href="../assets/img/sprite.svg#icon-oreille"/>
            </svg>
            <svg class="fiche-illustration-oreille fiche-illustration-oreille-droite" viewBox="0 0 57.32 80.86" xmlns="http://www.w3.org/2000/svg">
              <use id="useOreilleDroite" href="../assets/img/sprite.svg#icon-oreille"/>
            </svg>
            <img src="../assets/img/capteur.png" alt="" class="fiche-illustration-capteur fiche-illustration-masque">
          </div>
        </div>

        <div class="fiche-nom-wrapper">
          <h2 id="ficheNom" class="indiv-sidebar-identite-nom">-</h2>
          <div class="fiche-illustration-statut" id="ficheIllustrationStatut"></div>
        </div>

        <div class="fiche-entete-champs" id="carteIdentitePrincipale"></div>
        <hr class="indiv-sidebar-identite-separateur">
        <div class="fiche-entete-champs" id="carteIdentiteMarquage"></div>
        <hr class="indiv-sidebar-identite-separateur">
        <div class="fiche-entete-champs" id="carteIdentiteDates"></div>
      </div>
    </div>
  </aside>

  <main id="indivScreen">

    <!-- VUE LISTE -->
    <div id="vueListe">
      <div class="indiv-liste">
        <div class="indiv-liste-toolbar">
          <div class="indiv-colonnes-wrapper">
            <button type="button" id="btnFiltresColonnesIndividus" class="indiv-btn-filtres-colonnes" aria-label="Choisir les colonnes" title="Choisir les colonnes">
              <img src="../assets/img/filtre_horizontal.png" alt="" class="indiv-btn-filtres-colonnes-icon">
            </button>
            <div id="dropdownFiltresColonnesIndividus" class="indiv-colonnes-dropdown" style="display:none">
              <div id="itemsFiltresColonnesIndividus">
                <!-- Peuplée en JS par initFiltresColonnesListe() -->
              </div>
              <a id="resetFiltresColonnesIndividus" class="indiv-colonnes-reset">Réinitialiser</a>
            </div>
          </div>
        </div>
        <div class="indiv-row indiv-liste-entete" id="indivListeEntete">
          <!-- Peuplée en JS par mettreAJourEnteteListe() -->
        </div>
        <div id="indivTableBody">
          <!-- Peuplée en JS par rendrePageIndividus() -->
        </div>
      </div>

      <div class="table-footer">
        <div id="indivTableInfo" class="table-info">ligne(s) 0 à 0 sur 0</div>
        <nav id="indivPagination" class="table-pagination" aria-label="Pagination"></nav>
      </div>
    </div>

    <!-- VUE FICHE -->
    <div id="vueFiche" style="display:none">
      <div id="ficheLoading" style="display:none">
        <div class="fiche-loading-spinner"></div>
        <span class="fiche-loading-texte">Chargement en cours...</span>
      </div>
      <button id="btnRetourListe" class="indiv-btn-retour">
        <svg width="20" height="20" class="btn-retour-icon"><use href="../assets/img/sprite.svg#icon-retour"/></svg>
        <span>Retour à la liste</span>
      </button>

      <div class="fiche-grid-2x2">
          <div class="fiche-carte" id="carteDernieresLocalisations">
            <div class="fiche-carte-entete-ligne">
              <div class="fiche-carte-titre">Localisations</div>
              <div class="fiche-carte-controles">
                <input type="number" id="ficheInputN" placeholder="Toutes" min="1" title="Nombre de positions">
                <label>
                  Du
                  <input type="text" id="ficheDateFrom" placeholder="JJ/MM/AAAA" autocomplete="off">
                </label>
                <label>
                  Au
                  <input type="text" id="ficheDateTo" placeholder="JJ/MM/AAAA" autocomplete="off">
                </label>
                <button id="btnActualiserFiche" class="btn-apply">Actualiser</button>
              </div>
            </div>
            <div class="fiche-carte-corps">
              <div class="fiche-map-conteneur">
                <div id="ficheMapLocalisations" class="fiche-map"></div>
                <div id="popupLocalisations" class="fiche-map-popup"></div>
                <div class="fiche-map-toolbar-zoom">
                  <button id="btnZoomInLocalisations" class="fiche-toolbar-btn" title="Zoom avant">
                    <svg width="16" height="16"><use href="../assets/img/sprite.svg#icon-zoom-in"/></svg>
                  </button>
                  <button id="btnZoomOutLocalisations" class="fiche-toolbar-btn" title="Zoom arrière">
                    <svg width="16" height="16"><use href="../assets/img/sprite.svg#icon-zoom-out"/></svg>
                  </button>
                  <button id="btnZoomResetLocalisations" class="fiche-toolbar-btn" title="Recentrer">
                    <svg width="16" height="16" class="fiche-icon-recentrer"><use href="../assets/img/sprite.svg#icon-recentrer"/></svg>
                  </button>
                  <button id="btnFondsCarteLocalisations" class="fiche-toolbar-btn" title="Fonds de carte">
                    <svg width="16" height="16" class="fiche-icon-recentrer"><use href="../assets/img/sprite.svg#icon-couches"/></svg>
                  </button>
                </div>
                <div class="fiche-basemap-panel" id="basemapPanelLocalisations">
                  <div class="fiche-basemap-liste" id="basemapListeLocalisations">
                    <!-- Peuplée en JS par initBoutonFondsCarte() -->
                  </div>
                </div>
                <div id="compteurPositionsLocalisations" class="fiche-map-compteur">0 position</div>
              </div>
            </div>
          </div>
        <div class="fiche-carte">
          <div class="fiche-carte-titre">Distance parcourue par mois</div>
          <div class="fiche-carte-periode" id="periodeDistanceMois"></div>
          <div class="fiche-carte-corps">
            <div class="fiche-graphique-bloc" id="chartDistanceMoisWrapper">
              <canvas id="chartDistanceMois"></canvas>
            </div>
            <div class="fiche-graphique-legende" id="legendeColliersDistance">
              <!-- Peuplée en JS par construireLegendeColliers() -->
            </div>
          </div>
        </div>
        <div class="fiche-carte" id="carteCapturesRelaches">
          <div class="fiche-carte-titre">Captures &amp; Relâchés</div>
          <div class="fiche-carte-corps">
            <div class="capture-relache-liste" id="captureRelacheListe">
              <!-- Peuplée en JS par remplirEvenementsCaptureRelache() -->
            </div>
          </div>
        </div>
          <div class="fiche-carte" id="carteSites">
            <div class="fiche-carte-titre">Sites de capture &amp; relâché</div>
            <div class="fiche-carte-corps">
              <div class="capture-map-conteneur">
                <div id="ficheMapSites" class="fiche-map capture-map"></div>
                <div id="popupSites" class="fiche-map-popup"></div>
                <div class="fiche-map-toolbar-zoom">
                  <button id="btnZoomInSites" class="fiche-toolbar-btn" title="Zoom avant">
                    <svg width="16" height="16"><use href="../assets/img/sprite.svg#icon-zoom-in"/></svg>
                  </button>
                  <button id="btnZoomOutSites" class="fiche-toolbar-btn" title="Zoom arrière">
                    <svg width="16" height="16"><use href="../assets/img/sprite.svg#icon-zoom-out"/></svg>
                  </button>
                  <button id="btnZoomResetSites" class="fiche-toolbar-btn" title="Recentrer">
                    <svg width="16" height="16" class="fiche-icon-recentrer"><use href="../assets/img/sprite.svg#icon-recentrer"/></svg>
                  </button>
                  <button id="btnFondsCarteSites" class="fiche-toolbar-btn" title="Fonds de carte">
                    <svg width="16" height="16" class="fiche-icon-recentrer"><use href="../assets/img/sprite.svg#icon-couches"/></svg>
                  </button>
                </div>
                <div class="fiche-basemap-panel" id="basemapPanelSites">
                  <div class="fiche-basemap-liste" id="basemapListeSites">
                    <!-- Peuplée en JS par initBoutonFondsCarte() -->
                  </div>
                </div>
                <div class="legende-panel capture-map-legende">
                  <div class="legende-contenu">
                    <div id="legendeSitesCouleurs" class="legende-sites-couleurs">
                      <!-- Peuplée en JS par construireLegendeSites() -->
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
      </div>
    </div>

  </main>

  <script type="module" src="../assets/js/individuals.js"></script>
</body>

</html>
